# Render Blueprint：一键部署成都看雪山
# 用法：在 Render 后台选择 New → Blueprint，连接本 GitHub 仓库，
#       将自动读取本文件创建 Web 服务并部署。
services:
  - type: web
    name: chengdu-snow-mountain
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python chengdu_snow_mountain.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12